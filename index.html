<!DOCTYPE html>
<html>
    <head>
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>TO-DO LIST APP</title>
        <link rel="alternate icon" type="image/png" href="images/character.png">
        <link rel="stylesheet" href="css/style.css">
    </head>
    <body>
        <div class="container">
            <div class="todo-app">
                <h2>TO-DO List<img src="images/icon.png" id="icon"></h2>
                <div class="row">
                    <input type="text" id="input-box" placeholder="Add your text">
                    <button onclick="addTask()">Add</button>
                </div>
                <ul id="list-container">
                    <!-- <li class="checked">Task 1</li>
                    <li>Task 2</li>
                    <li>Task 3</li> -->   <!--the task are now hidden-->
                    <!--if we don't put the javascript file it will display task 1, 2, 3 -->
                </ul>
            </div>
        </div>
        <div class="character-runway">
            <input id="character-toggle" class="character-toggle" type="checkbox" aria-label="Move the character">
            <label class="character-button" for="character-toggle">
                <img src="images/character.png" alt="">
            </label>
        </div>
    <script src="scripts.js"></script>
    </body>
</html>
